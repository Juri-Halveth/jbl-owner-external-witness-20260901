name: JBL external owner witness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded witness mode
        required: true
        type: choice
        options:
          - readonly
          - reversible-write

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check websockets==15.0.1
      - name: Run bounded external witness
        env:
          WITNESS_MODE: ${{ inputs.mode }}
          TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
          PAIR_FRAME_B64: ${{ secrets.PAIR_FRAME_B64 }}
        run: python external_witness.py
